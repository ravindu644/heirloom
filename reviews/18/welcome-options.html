<title>heirloom welcome options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap');
:root { --ground: #EEF0EC; --surface: #FFFFFF; --raised: #E4E7E2; --ink: #121412; --muted: #474C47; --line: #D5D9D3; --edge: #7C827B; --you: #C4321A; --on-you: #FFFFFF; --ghost: #8A9089; --heat-1: #F2D2CD; --heat-2: #E4A398; --heat-3: #D56B5A; --rest: #23704E; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0E100E; --surface: #181A18; --raised: #232623; --ink: #F0F2EE; --muted: #A4A9A3; --line: #2B2F2B; --edge: #7C827B; --you: #FF6A4D; --on-you: #140806; --ghost: #7C827B; --heat-1: #4B2C24; --heat-2: #803E30; --heat-3: #BE543E; --rest: #5DBE8D; color-scheme: dark; } }
:root[data-theme="dark"] { --ground: #0E100E; --surface: #181A18; --raised: #232623; --ink: #F0F2EE; --muted: #A4A9A3; --line: #2B2F2B; --edge: #7C827B; --you: #FF6A4D; --on-you: #140806; --ghost: #7C827B; --heat-1: #4B2C24; --heat-2: #803E30; --heat-3: #BE543E; --rest: #5DBE8D; color-scheme: dark; }
:root { --words: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --figures: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--raised); color: var(--muted); font: 400 16px/1.45 var(--words);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
header { max-width: 1284px; margin: 0 auto 24px; display: grid; gap: 16px; }
header h1 { margin: 0; font: 600 24px/1.2 var(--words); color: var(--ink); }
header p { margin: 0; max-width: 60ch; }
.theme { display: flex; gap: 8px; flex-wrap: wrap; }
.theme button { min-height: 48px; padding: 0 20px; border-radius: 4px; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); font: 600 16px/1.3 var(--words); cursor: pointer; }
.theme button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.theme button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 412px)); justify-content: center; gap: 40px 24px; max-width: 1284px; margin: 0 auto; }
.option { margin: 0; display: grid; gap: 16px; align-content: start; min-width: 0; }
figcaption { font: 500 13px/1.3 var(--words); color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
figcaption b { font: 600 44px/1 var(--figures); color: var(--ink); }

/* The phone, drawn at 412 by 915 and scaled to whatever room the column has. */
.slot { width: 100%; aspect-ratio: 412 / 915; overflow: hidden; border-radius: 8px; outline: 1px solid var(--line); }
.frame {
  width: 412px; height: 915px; transform: scale(var(--s, 1)); transform-origin: top left;
  background: var(--ground); color: var(--muted); position: relative; display: grid; grid-template-rows: 36px 1fr 24px;
  -webkit-user-select: none; user-select: none;
}
.bar { padding: 10px 20px 0; font: 600 14px/1 var(--figures); color: var(--ink); }
.pill { width: 108px; height: 4px; border-radius: 999px; background: var(--ink); opacity: 0.4; justify-self: center; align-self: center; }
/* What it says at the top is the drawing; the free space lies under it; the title, its sentence and
   the button stand together in reach of the thumb. */
.screen { display: grid; grid-template-rows: auto 1fr auto auto auto; padding: 24px 20px 24px; min-height: 0; }
.draw { display: flex; }
.draw.bleed { margin-left: -20px; }
.art { display: block; max-width: 100%; height: auto; overflow: visible; }
.screen h2 { grid-row: 3; margin: 0 0 16px; font: 600 44px/1.05 var(--words); letter-spacing: -0.02em; color: var(--ink); text-wrap: balance; }
.screen p { grid-row: 4; margin: 0 0 24px; text-wrap: pretty; }
.btn { grid-row: 5; display: grid; place-items: center; height: 48px; padding: 0 20px; border-radius: 4px; background: var(--you); color: var(--on-you); font: 600 16px/1.3 var(--words); }

/* The drawings' parts, each a token. */
.y { fill: var(--you); }
.k { fill: var(--muted); }
.rest { fill: var(--rest); }
.track { fill: var(--line); }
.g { fill: none; stroke: var(--ghost); stroke-width: 2; stroke-dasharray: 6 4; }
.p { fill: var(--raised); }
.initial { fill: var(--ink); font: 600 16px var(--words); text-anchor: middle; dominant-baseline: central; }
.h0 { fill: var(--raised); } .h1 { fill: var(--heat-1); } .h2 { fill: var(--heat-2); } .h3 { fill: var(--heat-3); } .h4 { fill: var(--you); }
.ring { fill: none; stroke: var(--rest); stroke-width: 4; }
/* The header line every screen of the app starts with: the mark and the name, 48px tall, at the top left. */
.draw.stack { flex-direction: column; align-items: flex-start; }
.brand { display: flex; align-items: center; min-height: 48px; margin: -24px 0 24px; font: 600 16px/1.45 var(--words); color: var(--ink); }
.brand svg { height: 1lh; width: auto; margin-right: 8px; flex: none; }
.brand .gh { fill: none; stroke: var(--ghost); }
.today { fill: none; stroke: var(--ink); stroke-width: 2; }
/* The one thing that moves: the lap in progress fills once, as a lap segment does, and stays. */
.fill { transform-box: fill-box; transform-origin: left; animation: run 700ms cubic-bezier(0.2, 0, 0, 1) 400ms both; }
@keyframes run { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .fill { animation: none; } }

<script>
(() => {
  const root = document.documentElement, buttons = document.querySelectorAll('[data-set]');
  const set = (t) => {
    if (t) root.dataset.theme = t; else delete root.dataset.theme;
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === t)));
    try { localStorage.setItem('theme', t); } catch {}
  };
  let saved = '';
  try { saved = localStorage.getItem('theme') || ''; } catch {}
  set(saved);
  buttons.forEach((b) => b.addEventListener('click', () => set(b.dataset.set)));
  // Each phone is drawn at 412 wide and scaled to its column.
  const fit = (slot) => slot.style.setProperty('--s', slot.clientWidth / 412);
  const ro = new ResizeObserver((all) => all.forEach((e) => fit(e.target)));
  document.querySelectorAll('.slot').forEach((s) => { fit(s); ro.observe(s); });
})();
</script>
