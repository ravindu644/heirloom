.page{max-width:1240px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h-amber{--hue:#E3A63A}:root:not([data-theme="light"]) .h-olive{--hue:#B3C255}:root:not([data-theme="light"]) .h-teal{--hue:#4FC3C0}:root:not([data-theme="light"]) .h-sky{--hue:#6FB3EE}:root:not([data-theme="light"]) .h-indigo{--hue:#9A9DF5}:root:not([data-theme="light"]) .h-plum{--hue:#D48AE0}:root:not([data-theme="light"]) .h-clay{--hue:#C99873}:root:not([data-theme="light"]) .h-heat-2{--hue:#803E30}}
:root[data-theme="dark"] .h-amber{--hue:#E3A63A}:root[data-theme="dark"] .h-olive{--hue:#B3C255}:root[data-theme="dark"] .h-teal{--hue:#4FC3C0}:root[data-theme="dark"] .h-sky{--hue:#6FB3EE}:root[data-theme="dark"] .h-indigo{--hue:#9A9DF5}:root[data-theme="dark"] .h-plum{--hue:#D48AE0}:root[data-theme="dark"] .h-clay{--hue:#C99873}:root[data-theme="dark"] .h-heat-2{--hue:#803E30}
.avs{display:grid;gap:24px}

<script>
(function(){
  var root=document.documentElement;
  function wire(sel, attr, key, def){
    function set(t){ if(t===def) root.removeAttribute(attr); else root.setAttribute(attr,t);
      document.querySelectorAll(sel+' button').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.t===t));}); }
    var saved=def; try{ saved=localStorage.getItem(key)||def; }catch(e){}
    set(saved);
    document.querySelectorAll(sel+' button').forEach(function(b){ b.addEventListener('click',function(){ set(b.dataset.t); try{localStorage.setItem(key,b.dataset.t);}catch(e){} }); });
  }
  wire('.theme.mode','data-theme','heirloom-room-v4-theme','system');
  function fit(box){ var w=+box.dataset.w, h=+box.dataset.h, k=box.clientWidth/w; if(!k) return; box.style.setProperty('--k',k); box.style.height=(h*k)+'px'; }
  var boxes=[].slice.call(document.querySelectorAll('.fbox'));
  boxes.forEach(fit);
  if('ResizeObserver' in window){ var ro=new ResizeObserver(function(es){ es.forEach(function(e){ fit(e.target); }); }); boxes.forEach(function(b){ ro.observe(b); }); }
  else window.addEventListener('resize',function(){ boxes.forEach(fit); });
})();
</script>
