<title>Task cards, combined</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap");
:root{--ground:#EEF0EC;--surface:#FFFFFF;--raised:#E4E7E2;--ink:#121412;--muted:#474C47;--line:#D5D9D3;--edge:#7C827B;--you:#C4321A;--on-you:#FFFFFF;--rest:#23704E;--key:#E4E7E2;color-scheme:light;
  /* The card's step and the empty track on it. Light: raised on surface, line for the track. */
  --card:var(--raised);--card-track:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#0E100E;--surface:#181A18;--raised:#232623;--ink:#F0F2EE;--muted:#A4A9A3;--line:#2B2F2B;--edge:#7C827B;--you:#FF6A4D;--on-you:#140806;--rest:#5DBE8D;--key:#343934;color-scheme:dark;--card:var(--key);--card-track:var(--surface)}}
:root[data-theme="dark"]{--ground:#0E100E;--surface:#181A18;--raised:#232623;--ink:#F0F2EE;--muted:#A4A9A3;--line:#2B2F2B;--edge:#7C827B;--you:#FF6A4D;--on-you:#140806;--rest:#5DBE8D;--key:#343934;color-scheme:dark;--card:var(--key);--card-track:var(--surface)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--raised);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.t-label{font:500 13px/1.3 Barlow,sans-serif}.t-body{font:400 16px/1.45 Barlow,sans-serif}.t-strong{font:600 16px/1.3 Barlow,sans-serif}
.f-lg{font:600 44px/1 "Barlow Condensed",sans-serif;font-feature-settings:"tnum" 1}
.f-md{font:500 26px/1.1 "Barlow Condensed",sans-serif;font-feature-settings:"tnum" 1}
.m{color:var(--muted)}.you{color:var(--you)}
.page{max-width:1408px;margin:0 auto;display:grid;gap:40px}
.top-line{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.top-line p{font:600 24px/1.2 Barlow,sans-serif;max-width:60ch}
.theme{display:inline-flex;gap:4px}
.theme button{font:600 16px/1.3 Barlow,sans-serif;height:48px;padding:0 16px;border-radius:4px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);transition:background-color 100ms cubic-bezier(.2,0,0,1)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),412px));gap:40px 24px;align-items:start}
.fr{display:grid;gap:8px;min-width:0;align-content:start}
.fr.wide{grid-column:1/-1;max-width:795px}
.fr .cap{display:flex;gap:8px;align-items:baseline}
.num{font:600 26px/1 "Barlow Condensed",sans-serif;color:var(--you);flex:none}
.screen{background:var(--ground);padding:20px;border:1px solid var(--line);border-radius:8px}
.fr.wide .screen{padding:24px}

.panel{background:var(--surface);border-radius:8px;padding:16px;display:grid;gap:16px;container-type:inline-size;min-width:0}
.block{display:grid;gap:8px;min-width:0}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.lk{font:500 13px/1.3 Barlow,sans-serif;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:calc((48px - 1lh)/2) 0;margin:calc((48px - 1lh)/-2) 0;white-space:nowrap}
.lk.fold{justify-self:start}
.colhead{padding-left:56px;padding-right:16px}
.hours{position:relative;display:block;height:1lh;white-space:nowrap}
.hours span{position:absolute;transform:translateX(-50%)}
.hours .start{transform:none}.hours .end{transform:translateX(-100%)}

/* The card: a raised rectangle, nothing drawn inside it. Its edges are the habit row's: the box
   column 56px wide from the rectangle's left (the arrow and the lap squares centred on 28), the
   words on 56, the right end 16px in. */
.cards{list-style:none;display:grid;gap:8px}
.card{background:var(--card);border-radius:8px;padding:0 16px 16px 0;display:grid;gap:4px;min-width:0}
.c-top{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;min-height:48px;width:100%;padding-top:8px}
.c-title{font:600 16px/1.3 Barlow,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:16px}
.c-tot{justify-self:end}
.box{display:grid;place-items:center;width:56px;height:48px}
.arrow{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2}
.c-body{display:grid;gap:8px;padding-left:56px}
.sl{position:relative;display:block;height:8px;background:var(--card-track)}
.sl i{position:absolute;top:0;bottom:0;min-width:2px}
i.lap{background:var(--you)}i.rest{background:var(--rest)}i.void{box-shadow:inset 0 0 0 1px var(--you)}
.sl i.tick{width:2px;min-width:2px;top:-4px;bottom:-4px;background:var(--ink);margin-left:-1px}
.lines{list-style:none;display:grid;margin-top:8px}
.lapline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;min-height:48px}
.lapline .f{padding-right:16px}
.sq{width:12px;height:12px;background:var(--card-track);position:relative;justify-self:center}
.sq b{position:absolute;inset:0 auto 0 0;background:var(--you)}
.sq.hollow{background:none;box-shadow:inset 0 0 0 1px var(--you)}

.note{display:grid;gap:8px}
.field{display:flex;align-items:center;min-height:48px;padding:0 16px;border:1px solid var(--edge);border-radius:4px;background:var(--surface);color:var(--muted)}

@container (min-width: 600px){
  .colhead{padding-left:0;display:grid;grid-template-columns:minmax(0,1fr) 240px 96px;column-gap:16px;padding-right:16px}
  .colhead .hours{grid-column:2}
  .card{grid-template-columns:minmax(0,1fr) 240px 96px;column-gap:16px;row-gap:0}
  .c-top{grid-column:1/-1;grid-row:1;grid-template-columns:56px minmax(0,1fr) 96px}
  .c-top .c-title{max-width:calc(100% - 256px)}
  .c-body{display:contents}
  .card .sl{grid-column:2;grid-row:1;align-self:center;margin-top:8px;pointer-events:none}
  .c-sum{grid-column:1/span 2;grid-row:2;padding-left:56px}
  .lines{grid-column:1/-1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
  var root=document.documentElement, KEY='heirloom-task-cards-42-theme';
  function set(t){ if(t==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
    document.querySelectorAll('.theme button').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.t===t));}); }
  var saved='system'; try{ saved=localStorage.getItem(KEY)||'system'; }catch(e){}
  set(saved);
  document.querySelectorAll('.theme button').forEach(function(b){ b.addEventListener('click',function(){ set(b.dataset.t); try{localStorage.setItem(KEY,b.dataset.t);}catch(e){} }); });
})();
</script>
