name: Build

# Builds the phone app and the server on every push to main and every pull request, uploads
# them as artifacts, and on a v* tag (or a manual run with tag_name) publishes them as a release.
# The server is heirloomd for linux amd64 and arm64: one static file with the web app inside,
# so a machine that runs it needs no Go or Node (docs/DEPLOY.md).
# The APK is signed with the release key when the RELEASE_KEYSTORE (base64 of
# release.keystore), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets are set, and with
# a throwaway key when they are not (a fork, a pull request). Mirrors Droidspaces-OSS's ci.yml.
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag (existing or new, must match package.json version)"
        required: false
        type: string

permissions:
  # Needed to create the release on a tag; a pull request token is read-only regardless
  contents: write

jobs:
  apk:
    name: Build the Android app
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # One version, "version" in package.json. A tag must match it, so a forgotten
    # `make bump` fails here instead of shipping.
    - name: Settle the version
      run: |
        VERSION=$(node -p 'require("./package.json").version')
        if [ -n "$TAG" ]; then
          [ "${TAG#v}" = "$VERSION" ] || { echo "Tag $TAG does not match version $VERSION (run make bump NEW=${TAG#v})"; exit 1; }
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    # Capacitor 8 needs Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - run: pnpm install --frozen-lockfile

    # The key lives in a secret as base64; without it the APK is signed with a throwaway key
    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: env.RELEASE_KEYSTORE != ''
      run: echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore

    # A release signed with a throwaway key could never update the real app, so a release
    # run without the key stops here instead of publishing one
    - name: Require the key for a release
      if: env.TAG != ''
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        [ -n "$RELEASE_KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Releases are signed with the release key: set RELEASE_KEYSTORE and KEYSTORE_PASSWORD"; exit 1; }

    # The same steps as `make release-apk`, with the passwords passed as Gradle properties.
    # No server is filled in: the app asks for one at its first start.
    - name: Build the release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        make tokens
        VITE_APP=1 pnpm exec vite build --outDir dist-app
        pnpm exec cap sync android
        cd android
        ./gradlew assembleRelease --no-daemon \
          -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          -PKEY_ALIAS="$KEY_ALIAS" \
          -PKEY_PASSWORD="$KEY_PASSWORD"

    # Every build, release or not, is named <version>-<commit> so the exact source an
    # artifact came from is legible from its filename
    - name: Stage & Rename Artifacts
      run: |
        HASH=$(git log -1 --pretty=%h)
        mkdir -p dist
        mv android/app/build/outputs/apk/release/app-release.apk dist/heirloom-v${VERSION}-${HASH}.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: heirloom-apk
        path: dist/
        if-no-files-found: error
        retention-days: 14

  server:
    name: Build heirloomd
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        # `git describe` names the version heirloomd prints
        fetch-depth: 0

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache-dependency-path: server/go.sum

    - run: pnpm install --frozen-lockfile

    # The web app, copied into the binary, for this runner (amd64) and for arm64. CGO is off,
    # so both are static and run on any Linux of their architecture.
    - run: make server

    # Plain names, so releases/latest/download/heirloomd-linux-<arch> always works
    - name: Stage Artifacts
      run: |
        mkdir -p dist
        cp server/bin/heirloomd dist/heirloomd-linux-amd64
        cp server/bin/heirloomd-arm64 dist/heirloomd-linux-arm64
        cp server/deploy/heirloomd.service dist/
        ./dist/heirloomd-linux-amd64 -version

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: heirloomd
        path: dist/
        if-no-files-found: error
        retention-days: 14

  release:
    name: Publish the release
    needs: [ apk, server ]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    if: inputs.tag_name != '' || github.ref_type == 'tag'
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - run: cd dist && sha256sum * > SHA256SUMS

    # A manual run for a tag not made yet ends at HEAD
    - name: Generate Changelog
      run: |
        END=HEAD
        git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && END="${TAG}"
        PREV=$(git describe --tags --abbrev=0 "${END}^" 2>/dev/null || true)
        echo "Previous tag: ${PREV:-none}"
        {
          echo "## What's Changed"
          git log --no-merges --pretty=format:"* %s (%h)" ${PREV:+${PREV}..}${END}
          echo
        } > CHANGELOG.md

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: heirloom ${{ env.TAG }}
        target_commitish: ${{ github.sha }}
        files: dist/*
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
