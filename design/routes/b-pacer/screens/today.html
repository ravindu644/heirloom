<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../b.js"></script>
<style>
  .head { display: flex; align-items: baseline; gap: 12px; }
  .head .sub { font-size: 16px; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 0 24px; background: var(--surface); border-radius: 8px; }
  .strip div { padding: 14px 16px; }
  .strip div + div { border-left: 1px solid var(--line); }
  .strip .l { font: 500 13px var(--font-label); color: var(--muted); }
  .strip .fig { font-size: 30px; line-height: 1.1; display: block; margin-top: 2px; }
  .strip .fig.you { color: var(--you); }
  .strip small { font: 500 14px var(--font-label); color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 400px; gap: 24px; }
  .add { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 16px; margin-bottom: 18px; }
  .add b { font-weight: 600; color: var(--ink); font-size: 20px; line-height: 1; }
  .running { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; background: var(--ink); color: var(--ground); border-radius: 8px; margin-bottom: 18px; }
  .running .fig { font-size: 26px; }
  .running .t { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .running .btn { height: 36px; line-height: 36px; padding: 0 14px; font-size: 14px; background: none; color: var(--ground); border-color: var(--muted); }
  .sect { font: 600 14px var(--font-title); color: var(--muted); margin: 22px 0 10px; display: flex; justify-content: space-between; }
  .task.next .n { grid-row: span 2; }
  .start { height: 36px; line-height: 36px; padding: 0 16px; font-size: 15px; }
  .p .proj { color: var(--ink); font-weight: 500; }
  @media (max-width: 999px) {
    .cols { display: block; }
    .rail { display: none; }
    .strip { margin: 12px 0 14px; }
    .strip div { padding: 10px 12px; }
    .strip .fig { font-size: 24px; }
    .add { margin-bottom: 12px; }
    .running { margin-bottom: 12px; }
    .sect { margin: 16px 0 8px; }
    .task { padding: 12px 14px; }
  }
</style></head>
<body><script>
const t = D.tasks;
const row = (x, extra = '') => `<div class="task${extra}"><span class="t">${esc(x.title)}</span>
  <span class="n">${x.done}<small> of ${x.est}</small></span>
  <span class="p"><span class="proj">${B.proj(x.project)}</span>${B.sq(x, x.running)}</span></div>`;
shell({ active: 'Today', mark: B.mark, name: B.name, side: B.room, main: `
<div class="head"><h1>Today</h1><span class="sub">Tuesday 24 November</span></div>
<div class="strip">
  <div><span class="l">Done</span><span class="fig you">2h 05m</span><small>5 laps</small></div>
  <div><span class="l">Planned, left</span><span class="fig">4h 10m</span><small>10 laps</small></div>
  <div><span class="l">Last Tuesday</span><span class="fig">3h 20m</span><small>8 laps</small></div>
</div>
<div class="cols">
  <section>
    <div class="add"><b>+</b> Add a task. End with ~3 for three laps.</div>
    <div class="running"><span class="dot"></span><span class="fig">18:42</span><span class="t">${esc(t[0].title)}</span><a class="btn" href="#">Pause</a></div>
    <div class="sect"><span>Next</span></div>
    <div class="task next"><span class="t">${esc(t[1].title)}</span>
      <span class="n"><a class="btn go start" href="#">Start</a></span>
      <span class="p"><span class="proj">C</span>${B.sq(t[1])}<span>0 of 2</span></span></div>
    <div class="sect"><span>Later today</span><span>4 tasks, 8 laps</span></div>
    ${row(t[0])}${row(t[2])}${row(t[3])}${row(t[4])}
    <div class="sect"><span>Done</span></div>
    ${row(t[5], ' finished')}
  </section>
  <aside class="rail">
    <div class="panel">
      <h2 style="margin-bottom:14px">Today against last Tuesday</h2>
      ${B.dayLane(true)}
      <p class="sub" style="margin-top:14px;font-size:15px">You started 80 minutes later than last Tuesday. That Tuesday picked up again at 19:30 for two more laps.</p>
    </div>
    <div class="panel" style="margin-top:24px">
      <h2 style="margin-bottom:12px">Where today went</h2>
      ${[['C', 50, '2 laps, plus this one'], ['Uni', 50, '2 laps'], ['React', 25, '1 lap']].map(([n, m, l]) => `
        <div style="display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;padding:7px 0">
          <span style="font-weight:500">${n}</span>
          <div><div style="height:6px;background:var(--ink);width:${m / 50 * 100}%"></div><div class="sub" style="font-size:13px;margin-top:4px">${l}</div></div>
          <span class="fig" style="text-align:right;font-size:20px">${D.fmt(m)}</span></div>`).join('')}
    </div>
  </aside>
</div>` });
</script></body></html>
