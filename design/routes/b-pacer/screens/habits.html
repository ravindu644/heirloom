<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habits</title>
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../b.js"></script>
<style>
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 400px; gap: 24px; margin-top: 22px; }
  .hab { display: grid; grid-template-columns: 1fr 236px 56px; align-items: center; gap: 16px; padding: 14px 16px; background: var(--surface); border-radius: 8px; }
  .hab + .hab { margin-top: 6px; }
  .hab b { font-weight: 500; font-size: 16px; display: block; line-height: 1.3; }
  .hab small { font-size: 13px; color: var(--muted); }
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font: 500 11px var(--font-label); color: var(--muted); }
  .wk i { display: block; height: 22px; background: var(--raised); margin-top: 4px; }
  .wk i.y { background: var(--you); }
  .wk i.miss { background: var(--raised); box-shadow: inset 0 -3px 0 var(--ghost); }
  .wk .today { color: var(--ink); font-weight: 600; }
  .wk .today i { outline: 2px solid var(--ink); outline-offset: 1px; }
  .check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; justify-self: end; }
  .check.on { background: var(--you); border-color: var(--you); }
  .check.on::after { content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--on-you); border-bottom: 2.5px solid var(--on-you); transform: rotate(-45deg) translate(1px, -1px); }
  .ghostline { display: grid; grid-template-columns: 80px 1fr 64px; gap: 10px; align-items: center; padding: 8px 0; }
  .ghostline .lane { height: 12px; background: var(--raised); position: relative; }
  .ghostline .lane b { position: absolute; inset: 0 auto 0 0; background: var(--you); }
  .ghostline .lane.g b { background: none; border: 1.5px dashed var(--ghost); }
  .ghostline .fig { text-align: right; font-size: 18px; }
  @media (max-width: 999px) {
    .cols { display: block; margin-top: 14px; }
    .hab { grid-template-columns: 1fr 48px; gap: 10px 12px; padding: 12px 14px; }
    .hab .wk { grid-column: 1 / -1; order: 3; }
    .rail { margin-top: 12px; }
    .head .btn { display: none; }
  }
</style></head>
<body><script>
const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const row = h => `<div class="hab"><div><b>${esc(h.name)}</b><small>${h.when}${h.run > 1 ? `, ${h.run} days running` : ''}</small></div>
  <div class="wk">${h.week.map((v, i) => `<span class="${i === 1 ? 'today' : ''}">${days[i]}<i class="${v === 1 ? 'y' : v === 0 && i < 1 ? 'miss' : ''}"></i></span>`).join('')}</div>
  <span class="check${h.doneToday ? ' on' : ''}" role="checkbox" aria-checked="${h.doneToday}" aria-label="${esc(h.name)}"></span></div>`;
const done = D.habits.filter(h => h.doneToday).length;
shell({ active: 'Habits', mark: B.mark, name: B.name, side: B.room, main: `
<div class="head"><div><h1>Habits</h1><p class="sub" style="margin-top:4px">${done} of ${D.habits.length} today. Two left, both for tonight.</p></div><a class="btn" href="#">New habit</a></div>
<div class="cols">
  <section>${D.habits.map(row).join('')}</section>
  <aside class="rail">
    <div class="panel">
      <h2 style="margin-bottom:10px">This week against last</h2>
      <div class="ghostline"><span class="sub" style="font-size:13px">This week</span><div class="lane"><b style="width:${7 / 35 * 100}%"></b></div><span class="fig">7</span></div>
      <div class="ghostline"><span class="sub" style="font-size:13px">Last week</span><div class="lane g"><b style="width:${24 / 35 * 100}%"></b></div><span class="fig" style="color:var(--muted)">24</span></div>
      <p style="margin-top:10px;font-size:15px">Last week by Tuesday night you had 8. One more tonight and you match it.</p>
    </div>
  </aside>
</div>` });
</script></body></html>
