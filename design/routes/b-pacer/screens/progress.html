<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress</title>
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../b.js"></script>
<style>
  .finding { font: 600 30px/1.15 var(--font-title); letter-spacing: -0.015em; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; margin-top: 22px; }
  .s8 { grid-column: span 8; } .s4 { grid-column: span 4; }
  .panel h2 { display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 small { font: 500 13px var(--font-label); color: var(--muted); }
  svg text { font: 500 12px var(--font-label); fill: var(--muted); }
  svg .lbl { font: 600 15px var(--font-figure-md); font-variant-numeric: tabular-nums; }
  .key { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .key i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--you); vertical-align: middle; margin-right: 6px; }
  .key i.g { border-top: 2px dashed var(--ghost); }
  .big { font: 600 56px/1 var(--font-figure-lg); font-variant-numeric: tabular-nums; }
  .days14 { display: flex; gap: 5px; margin: 14px 0 10px; }
  .days14 i { width: 14px; height: 14px; border-radius: 50%; background: var(--you); display: block; }
  .days14 i.rest { background: none; border: 2px solid var(--rest); }
  .days14 i.off { background: var(--raised); }
  .pb { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; gap: 12px; }
  .pb .fig { font-size: 20px; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); gap: 4px; }
  .heat i { aspect-ratio: 1; background: var(--raised); display: block; }
  .heat i.h1 { background: var(--heat-1); }
  .heat i.h2 { background: var(--heat-2); }
  .heat i.h3 { background: var(--heat-3); }
  .heat i.h4 { background: var(--you); }
  .heat i.none { background: none; }
  .heat i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .heatwrap { display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
  .wd { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font: 500 11px var(--font-label); color: var(--muted); align-items: center; }
  .months { font: 500 12px var(--font-label); color: var(--muted); margin-bottom: 6px; }
  .heatrow { display: flex; gap: 40px; align-items: flex-start; margin-top: 14px; }
  .tot { display: grid; gap: 14px; padding-top: 22px; }
  .tot .fig { font-size: 32px; display: block; }
  .tot .sub { font-size: 14px; }
  .hkey { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .hkey i { width: 12px; height: 12px; display: inline-block; }
  .proj { display: grid; grid-template-columns: 64px 1fr 72px; gap: 10px; align-items: center; padding: 9px 0; }
  .proj .bar { position: relative; height: 10px; background: var(--raised); }
  .proj .bar b { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
  .proj .bar u { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ghost); }
  .proj .fig { text-align: right; font-size: 20px; }
  .proj .sub { font-size: 12px; }
  @media (max-width: 999px) {
    .finding { font-size: 24px; }
    .grid { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .panel { padding: 16px; }
    .big { font-size: 44px; }
    .hidephone { display: none; }
  }
</style></head>
<body><script>
const lw = D.lastWeek.map(d => d.min), tw = D.thisWeek.slice(0, 2).map(d => d.min);
const cum = a => a.reduce((o, v) => (o.push((o.at(-1) || 0) + v), o), []);
const L = cum(lw), T = cum(tw);
const phone = innerWidth < 1000;
const W = phone ? 340 : 720, H = phone ? 190 : 250, pl = 34, pr = 64, pt = 12, pb = 26, max = 16 * 60;
const X = i => pl + i * (W - pl - pr) / 6, Y = m => pt + (1 - m / max) * (H - pt - pb);
const path = a => a.map((m, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(m).toFixed(1)}`).join('');
const chart = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="This week so far 5h 25m, last week 15h 50m in total">
  ${[0, 4, 8, 12, 16].map(h => `<line x1="${pl}" x2="${W - pr}" y1="${Y(h * 60)}" y2="${Y(h * 60)}" stroke="var(--line)" stroke-width="${h ? 1 : 1.5}"/><text x="${pl - 8}" y="${Y(h * 60) + 4}" text-anchor="end">${h}h</text>`).join('')}
  ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" ${i === 1 ? 'style="fill:var(--ink);font-weight:600"' : ''}>${d}</text>`).join('')}
  <path d="${path(L)}" fill="none" stroke="var(--ghost)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="lbl" x="${X(6) + 8}" y="${Y(L[6]) + 5}" style="fill:var(--muted)">15h 50m</text>
  <path d="${path(T)}" fill="none" stroke="var(--you)" stroke-width="3"/>
  <circle cx="${X(1)}" cy="${Y(T[1])}" r="5" fill="var(--you)"/>
  <text class="lbl" x="${X(1) + 10}" y="${Y(T[1]) + 18}" style="fill:var(--you)">5h 25m</text>
</svg>`;

const lvl = m => m == null ? 'none' : m === 0 ? '' : m <= 75 ? 'h1' : m <= 150 ? 'h2' : m <= 200 ? 'h3' : 'h4';
const hd = D.days.slice(7), cw = phone ? 26 : 30;
const heat = `<div class="months" style="position:relative;height:16px;margin-left:36px">${[['Sep', 0], ['Oct', 3], ['Nov', 7]].map(([m, c]) => `<span style="position:absolute;left:${c * cw}px">${m}</span>`).join('')}</div>
  <div class="heatwrap"><div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>
  <div class="heat" style="grid-template-columns:repeat(11, ${cw - 4}px);width:max-content">${hd.map(d => `<i class="${lvl(d.min)}${d.isToday ? ' today' : ''}" title="${d.key}"></i>`).join('')}</div></div>
  <div class="hkey">${[['var(--raised)', 'none'], ['var(--heat-1)', '1 to 3 laps'], ['var(--heat-2)', '4 to 6'], ['var(--heat-3)', '7 or 8'], ['var(--you)', '9 or more']].map(([c, l]) => `<span style="display:inline-flex;gap:5px;align-items:center;margin-right:8px"><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
const kept = hd.filter(d => d.min != null), active = kept.filter(d => d.min > 0), total = D.sum(kept.map(d => d.min));
const days = D.days.filter(d => d.min != null);
const longest = days.reduce((a, b) => (b.min > a.min ? b : a));
const weeks = []; for (let i = 0; i < 77; i += 7) weeks.push({ start: D.days[i], min: D.sum(D.days.slice(i, i + 7).map(d => d.min)) });
const bestWeek = weeks.reduce((a, b) => (b.min > a.min ? b : a));
const dmy = d => d.date.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const last14 = D.days.slice(65, 79);

const prev = { c: 300, react: 250, uni: 225, next: 100 }; // the seven days before, Wed 11 to Tue 17 Nov
console.assert(D.sum(Object.values(prev)) === D.sum(D.days.slice(65, 72).map(d => d.min)), 'previous 7 days split');
const pmax = 400;
const projects = D.split.map(s => `<div class="proj"><span style="font-weight:500">${B.proj(s.project)}</span>
  <div><div class="bar"><b style="width:${s.min / pmax * 100}%"></b><u style="left:${prev[s.project] / pmax * 100}%"></u></div>
  <div class="sub" style="margin-top:5px">${s.min / 25} laps, ${s.min === prev[s.project] ? 'same as' : (s.min > prev[s.project] ? 'up ' : 'down ') + D.fmt(Math.abs(s.min - prev[s.project])) + ' on'} the week before</div></div>
  <span class="fig">${D.fmt(s.min)}</span></div>`).join('');

shell({ active: 'Progress', mark: B.mark, name: B.name, side: B.room, main: `
<h1 class="sub" style="font:500 15px var(--font-body);color:var(--muted)">Progress, week of 23 November</h1>
<p class="finding">One lap behind last week. The lap you are in now draws you level.</p>
<div class="grid">
  <div class="panel s8">
    <h2>This week against last week <small>running total</small></h2>
    <div style="margin-top:12px">${chart}</div>
    <div class="key"><span><i></i>This week</span><span><i class="g"></i>Last week, 5h 50m by Tuesday</span></div>
  </div>
  <div class="panel s4">
    <h2>Streak</h2>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:10px"><span class="big">13</span><span class="sub">days in a row</span></div>
    <div class="days14">${last14.map(d => `<i class="${d.min ? '' : (D.rests.includes(d) ? 'rest' : 'off')}"></i>`).join('')}</div>
    <p style="font-size:15px">Thursday the 19th was your rest day. One a week keeps the streak going.</p>
    <div class="hidephone" style="margin-top:18px">
      <h2 style="margin-bottom:6px">Your bests</h2>
      <div class="pb"><span>Longest day</span><span><span class="fig">${D.fmt(longest.min)}</span> <span class="sub" style="font-size:13px">${dmy(longest)}</span></span></div>
      <div class="pb"><span>Best week</span><span><span class="fig">${D.fmt(bestWeek.min)}</span> <span class="sub" style="font-size:13px">from ${dmy(bestWeek.start)}</span></span></div>
    </div>
  </div>
  <div class="panel s8">
    <h2>Since your first lap <small>14 September</small></h2>
    <div class="heatrow"><div>${heat}</div>
      <div class="tot hidephone">
        <div><span class="fig">${D.fmt(total).replace('h', 'h')}</span><span class="sub">of focus, ${total / 25} laps</span></div>
        <div><span class="fig">${active.length} of ${kept.length}</span><span class="sub">days with at least one lap</span></div>
        <div><span class="fig">Sundays</span><span class="sub">10 of 10 with a lap, your steadiest day</span></div>
      </div></div>
  </div>
  <div class="panel s4">
    <h2>Last 7 days by project <small>${D.fmt(925)}</small></h2>
    <div style="margin-top:6px">${projects}</div>
    <div class="key" style="margin-top:4px"><span><i class="g" style="width:0;height:12px;border-top:0;border-left:2px dashed var(--ghost)"></i>the 7 days before</span></div>
  </div>
</div>` });
</script></body></html>
