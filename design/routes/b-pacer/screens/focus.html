<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus</title>
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../b.js"></script>
<style>
  .focus { display: grid; grid-template-columns: 1fr 400px; gap: 24px; height: 100%; }
  .clock { display: flex; flex-direction: column; padding: 8px 24px 0 0; }
  .task-name { font: 500 22px/1.3 var(--font-title); max-width: 18em; }
  .proj { font-size: 14px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .digits { font: 600 var(--size-figure-xl)/0.9 var(--font-figure-xl); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; margin: 28px 0 8px -4px; }
  .ends { color: var(--muted); font-size: 16px; }
  .ctrl { display: flex; gap: 8px; margin-top: 36px; }
  .rail { display: flex; flex-direction: column; gap: 24px; }
  .next-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .next-row:first-of-type { border-top: 0; }
  .say { margin-top: 14px; font-size: 15px; }
  @media (min-width: 1000px) { .digits { font-size: 300px; margin-top: 56px; } .task-name { font-size: 28px; } }
  @media (max-width: 999px) {
    .focus { display: flex; flex-direction: column; gap: 0; }
    .clock { padding: 0; flex: none; }
    .digits { margin: 18px 0 2px -3px; }
    .rail .daypanel { display: none; } .rail .upnext .next-row:nth-of-type(n+2) { display: none; } .rail { gap: 12px; }
    .rail { margin-top: 28px; }
    .ctrl { margin-top: 20px; }
    .ctrl .btn { flex: 1; }
  }
</style></head>
<body><script>
const t = D.tasks[0];
shell({ active: 'Focus', mark: B.mark, name: B.name, side: B.room, main: `
<div class="focus">
  <section class="clock">
    <div class="lapline"><span><b>Lap 2 of 4</b>, focus</span><span>long break after lap 4</span></div>
    ${B.laps(2, 25)}
    <div style="margin-top:36px">
      <div class="proj"><span class="dot"></span>${B.proj(t.project)} · pomodoro 3 of 4 on this task</div>
      <h1 class="task-name">${esc(t.title)}</h1>
    </div>
    <div class="digits" aria-label="18 minutes 42 seconds left">18:42</div>
    <div class="ends">of 25:00, ends at 16:59</div>
    <div class="ctrl"><a class="btn" href="#">Pause</a><a class="btn quiet" href="#">Stop and log 6 min</a></div>
  </section>
  <aside class="rail">
    <div class="panel">
      <h2>Against last Tuesday</h2>
      <div class="race" style="margin-top:16px">
        <span class="who">You</span><div class="lane"><div class="bar" style="width:65.5%"></div></div><span class="v">2h 11m</span>
        <span class="who">Ghost</span><div class="lane g"><div class="bar" style="width:75%"></div></div><span class="v">2h 30m</span>
      </div>
      <p class="say"><span class="chip">&minus;19m</span> at 16:40. Finish this lap and you draw level.</p>
    </div>
    <div class="panel daypanel">
      <h2 style="margin-bottom:14px">Your day so far</h2>
      ${B.dayLane()}
    </div>
    <div class="panel upnext">
      <h2 style="margin-bottom:6px">Up next</h2>
      ${D.tasks.slice(1, 3).map(x => `<div class="next-row"><span>${esc(x.title)}</span><span class="fig muted">${x.done}/${x.est}</span></div>`).join('')}
    </div>
  </aside>
</div>` });
</script></body></html>
