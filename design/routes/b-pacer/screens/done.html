<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lap done</title>
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../b.js"></script>
<style>
  .done { display: grid; grid-template-columns: 1fr 400px; gap: 24px; height: 100%; }
  .say-big { font: 600 44px/1.05 var(--font-title); letter-spacing: -0.02em; margin-top: 44px; max-width: 11em; }
  .race.big { grid-template-columns: 56px 1fr 130px; gap: 14px 14px; margin-top: 32px; max-width: 760px; } .race.big .lane { height: 32px; } .race.big .v { font-size: 44px; } .race.big .v.you { color: var(--you); } .race.big .lane .bar::after { content: ""; position: absolute; right: -2px; top: -10px; bottom: -10px; width: 3px; background: var(--ink); }
  .total { display: flex; align-items: baseline; gap: 14px; margin-top: 28px; }
  .total .fig { font-size: 120px; line-height: 0.9; }
  .total span { color: var(--muted); font-size: 18px; }
  .facts { margin-top: 20px; font-size: 17px; line-height: 1.5; max-width: 30em; }
  .ctrl { display: flex; gap: 8px; margin-top: 32px; }
  .cheer { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: 8px; }
  .cheer b { font-weight: 600; }
  .chip.level { background: var(--raised); }
  .rail { display: flex; flex-direction: column; gap: 24px; }
  @media (max-width: 999px) {
    .done { display: flex; flex-direction: column; gap: 0; }
    .say-big { font-size: 34px; margin-top: 30px; }
    .total .fig { font-size: 88px; }
    .race.big { grid-template-columns: 56px 1fr 130px; gap: 14px 14px; margin-top: 32px; max-width: 760px; } .race.big .lane { height: 32px; } .race.big .v { font-size: 44px; } .race.big .v.you { color: var(--you); } .race.big .lane .bar::after { content: ""; position: absolute; right: -2px; top: -10px; bottom: -10px; width: 3px; background: var(--ink); }
  .total { margin-top: 18px; }
    .ctrl .btn { flex: 1; }
    .rail { margin-top: 24px; gap: 10px; }
    .ctrl { margin-top: 24px; }
  }
</style></head>
<body><script>
shell({ active: 'Focus', mark: B.mark, name: B.name, side: B.roomLate, main: `
<div class="done">
  <section>
    <div class="lapline"><span><b>Lap 2 of 4</b>, done</span><span>long break after lap 4</span></div>
    ${B.laps(3, 0)}
    <p class="say-big">Level with last Tuesday.</p>
    <div class="race big">
      <span class="who">You</span><div class="lane"><div class="bar" style="width:75%"></div></div><span class="v you">2h 30m</span>
      <span class="who">Ghost</span><div class="lane g"><div class="bar" style="width:75%"></div></div><span class="v">2h 30m</span>
    </div>
    <p class="facts">Six pomodoros today. K&amp;R is at 3 of 4, and this week has caught up with last week.</p>
    <div class="ctrl"><a class="btn go" href="#">Start 5 min break</a><a class="btn quiet" href="#">Skip break</a></div>
  </section>
  <aside class="rail">
    <div class="cheer"><span class="avatar">S</span><div><b>Sachi</b> cheered: nice one<div class="sub" style="font-size:13px">Her lap ended at 16:51, she is on a break</div></div></div>
    <div class="panel daypanel">
      <h2 style="margin-bottom:14px">Your day so far</h2>
      ${B.dayLane(false, true)}
      <p class="sub" style="margin-top:14px;font-size:14px">Last Tuesday went quiet from 14:55 to 19:30.</p>
    </div>
  </aside>
</div>` });
</script></body></html>
