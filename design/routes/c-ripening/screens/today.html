<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../c.js"></script>
<title>Today</title>
<style>
  .f { display: grid; grid-template-columns: 1fr 360px; gap: 40px; max-width: 1120px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .head .sub { font-size: 16px; margin-top: 4px; }
  .crate { margin-top: 18px; padding: 18px 20px; background: var(--paper); border-radius: 12px; }
  .crate .k { font: 700 13px var(--font-label); color: var(--muted); display: flex; justify-content: space-between; margin-top: 10px; }
  .add { margin-top: 14px; height: 52px; border-radius: 999px; background: var(--paper); display: flex; align-items: center; padding: 0 22px; color: var(--muted); border: 2px solid var(--line); }
  .next { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; background: var(--ink); color: var(--paper); border-radius: 12px; }
  .next .k { font: 700 13px var(--font-label); opacity: 1; color: var(--stage-green); }
  .next .t { font-weight: 700; }
  .sect { font: 700 15px var(--font-heading); margin: 22px 0 8px; display: flex; justify-content: space-between; }
  .sect span:last-child { color: var(--muted); font-weight: 400; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 14px 16px; background: var(--paper); border-radius: 12px; align-items: center; }
  .row + .row { margin-top: 6px; }
  .row .t { font-weight: 700; }
  .row .p { font-size: 13px; color: var(--muted); }
  .row .n { grid-row: span 2; font: 800 18px var(--font-heading); font-variant-numeric: tabular-nums; }
  .row.done .t { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
  .mini { border-radius: 12px; overflow: hidden; height: 240px; position: relative; background: var(--unripe); }
  .mini .lv { position: absolute; inset: auto 0 0 0; background: var(--ripe); }
  .mini .in { position: relative; padding: 18px 20px; }
  @media (max-width: 999px) { .f { display: block; } .right { display: none; } .head .btn { display: none; } }
</style></head>
<body><script>
const t = D.tasks;
const all = []; t.forEach(x => { for (let i = 0; i < x.est; i++) all.push(i < x.done ? 'r' : x.running && i === x.done ? 'h' : ''); });
all.sort((a, b) => ({ r: 0, h: 1, '': 2 })[a] - ({ r: 0, h: 1, '': 2 })[b]);
const row = (x, cls = '') => `<div class="row ${cls}"><span class="t">${esc(x.title)}</span><span class="n">${x.done}/${x.est}</span><span class="p" style="display:flex;gap:10px;align-items:center">${fruit(x, x.running)}<span>${C.proj(x.project)}${x.running ? ', ripening now' : ''}</span></span></div>`;
shell({ active: 'Today', name: C.name, mark: C.mark(), main: `
<div class="f">
  <section>
    <div class="head"><div><h1>Today</h1><p class="sub">Tuesday 24 November</p></div></div>
    <div class="crate"><span class="fruit big">${all.map(c => `<i class="${c}"></i>`).join('')}</span>
      <div class="k"><span>5 ripe, 1 ripening, 9 still green</span><span>2h 05m</span></div></div>
    <div class="add">Add a task. Put ~3 at the end for three.</div>
    <div class="next"><div><div class="k">Next</div><div class="t">${esc(t[1].title)}</div></div><a class="btn start" href="#">Start</a></div>
    <div class="sect"><span>Still green</span><span>4 tasks</span></div>
    ${row(t[0])}${row(t[2])}${row(t[3])}${row(t[4])}
    <div class="sect"><span>Picked</span><span></span></div>
    ${row(t[5], 'done')}
  </section>
  <aside class="right">
    <div class="mini"><div class="lv" style="height:25%"></div><div class="in"><div style="font:700 13px var(--font-label)">Ripening</div><div class="clock" style="font-size:72px;margin-top:6px">18:42</div><div style="font-weight:700;margin-top:6px">${esc(t[0].title)}</div></div></div>
    <p style="margin-top:18px;font:700 16px var(--font-heading)">Last Tuesday</p>
    <p class="sub" style="margin-top:4px">8 ripe by the end of the day. You had 6 of them by now.</p>
  </aside>
</div>` });
</script></body></html>
