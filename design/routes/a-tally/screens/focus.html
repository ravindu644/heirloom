<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../a.js"></script>
<title>Focus</title>
<style>
  .f { display: grid; grid-template-columns: 1fr 380px; gap: 64px; }
  .label { font: 500 13px var(--font-label); color: var(--muted); display: flex; justify-content: space-between; }
  .gate { margin: 10px 0 4px; }
  .task { margin-top: 30px; }
  .task .p { font: 500 14px var(--font-label); color: var(--muted); margin-bottom: 6px; }
  .task h1 { font-size: 26px; max-width: 16em; }
  .clock { margin: 22px 0 6px -4px; }
  .ends { color: var(--muted); }
  .ctrl { display: flex; gap: 8px; margin-top: 28px; }
  .today { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr auto; gap: 6px 16px; align-items: center; }
  .today .k { font: 500 13px var(--font-label); color: var(--muted); }
  .today .v { font: 600 20px var(--font-heading); font-variant-numeric: tabular-nums; }
  .say { grid-column: 1 / -1; font-size: 15px; color: var(--muted); }
  .rail h2 { margin-bottom: 4px; }
  .right .gate { margin-top: 18px; }
  @media (min-width: 1000px) { .clock { font-size: 220px; } .task h1 { font-size: 34px; } .left .gatebox { display: none; } }
  @media (max-width: 999px) { .f { display: block; } .right { display: none; } .ctrl .btn { flex: 1; } }
</style></head>
<body><script>
const t = D.tasks[0];
const gate = h => tally(['ink', 0.25, 'pencil', 'pencil'], { h, gap: h * 0.2, w: h * 0.055, slashes: ['pencil'], seed: 3 });
const todayT = tally(['ink', 'ink', 'ink', 'ink', 'ink', 0.25], { h: 30, gap: 7, w: 2.6, groupGap: 16, slashes: ['ink'], seed: 5 });
shell({ active: 'Focus', name: A.name, main: `
<div class="col f">
  <section class="left">
    <div class="gatebox"><div class="label"><span>Set two</span><span>long break after the fourth</span></div>
    <div class="gate">${gate(88)}</div></div>
    <div class="task"><div class="p">${A.proj(t.project)}, the third of four on this task</div><h1>${esc(t.title)}</h1></div>
    <div class="clock">18:42</div>
    <div class="ends">of 25 minutes, ends at 16:59</div>
    <div class="ctrl"><a class="btn" href="#">Pause</a><a class="btn quiet" href="#">Stop</a></div>
    <div class="today"><span class="k">Today</span>${todayT}<span class="v">2h 05m</span>
      <p class="say">Last Tuesday you had 2h 30m by this time. This one makes it 2h 30m.</p></div>
  </section>
  <aside class="right">
    <div class="label"><span>Set two</span><span>long break after the fourth</span></div>
    <div class="gate">${gate(170)}</div>
    <h2 style="margin-top:40px">Up next</h2>
    ${D.tasks.slice(1, 4).map(x => `<div class="row"><span class="t">${esc(x.title)}</span><span class="tal">${tally(taskMarks(x), { h: 26, gap: 8, w: 3, slashes: [], seed: x.id })}</span><span class="p">${A.proj(x.project)}</span></div>`).join('')}
  </aside>
</div>` });
</script></body></html>
