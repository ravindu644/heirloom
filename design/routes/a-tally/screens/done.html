<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../route.css">
<script src="../../../shared/data.js"></script><script src="../../../shared/shell.js"></script><script src="../a.js"></script>
<title>Pomodoro done</title>
<style>
  .f { display: grid; grid-template-columns: 1fr 380px; gap: 64px; }
  .label { font: 500 13px var(--font-label); color: var(--muted); display: flex; justify-content: space-between; }
  .gate { margin: 14px 0 0; }
  .big { font: 600 44px/1.08 var(--font-heading); letter-spacing: -0.02em; margin-top: 34px; max-width: 12em; }
  .say { font-size: 18px; margin-top: 16px; max-width: 28em; }
  .ctrl { display: flex; gap: 8px; margin-top: 32px; }
  .facts { margin-top: 34px; border-top: 1px solid var(--rule); }
  .facts .row .v { font: 600 18px var(--font-heading); font-variant-numeric: tabular-nums; }
  @media (max-width: 999px) { .f { display: block; } .big { font-size: 34px; margin-top: 26px; } .ctrl .btn { flex: 1; } .right { margin-top: 8px; } .right h2 { display: none; } }
</style></head>
<body><script>
const gate = h => tally(['ink', 'ink', 'pencil', 'pencil'], { h, gap: h * 0.2, w: h * 0.055, slashes: ['pencil'], seed: 3 });
shell({ active: 'Focus', name: A.name, main: `
<div class="col f">
  <section>
    <div class="label"><span>Set two</span><span>two to go before the long break</span></div>
    <div class="gate">${gate(innerWidth < 1000 ? 120 : 200)}</div>
    <p class="big">Two down in this set.</p>
    <p class="say">That was your sixth today, and it puts you level with last Tuesday: 2h 30m.</p>
    <div class="ctrl"><a class="btn go" href="#">Take five</a><a class="btn quiet" href="#">Keep going</a></div>
  </section>
  <aside class="right">
    <h2>Where it went</h2>
    <div class="facts">
      <div class="row"><span class="t">K&amp;R 5.1 to 5.5</span><span class="v">3 of 4</span><span class="p">C</span></div>
      <div class="row"><span class="t">This week</span><span class="v">5h 50m</span><span class="p">same as last week by Tuesday</span></div>
      <div class="row"><span class="t">Sachi</span><span class="v">nice one</span><span class="p">cheered you a minute ago</span></div>
    </div>
  </aside>
</div>` });
</script></body></html>
